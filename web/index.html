<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chùa Online</title>
<link rel="stylesheet" href="/vendor/font/400.css">
<link rel="stylesheet" href="/vendor/font/700.css">
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/",
  "@pixiv/three-vrm": "/vendor/three-vrm/lib/three-vrm.module.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: 'Be Vietnam Pro', 'Segoe UI', sans-serif; color: #fff3d6; }
  /* Fixed 1080x1920 stage, scaled to fit the window (scale is 1 inside LIVE Studio). */
  #stage { position: absolute; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; }
  #stage > * { position: absolute; }
  #c, #labels { inset: 0; }
  /* CSS2DRenderer sets z-index on each label; contain them below the HUD. */
  #labels { pointer-events: none; z-index: 0; }
  #stage > :not(#c):not(#labels) { z-index: 1; }
  /* HUD stays inside the 12%-70% band or on the right edge, never in the 300x300 top-left camera (FR-08). */
  /* Lacquer + gilt, matched to the hall. Motion: one ease, entries slower than exits. */
  :root {
    --gilt: #e2b866; --gilt-line: rgba(226, 184, 102, .55); --ink: #fff1dc;
    --ease-out: cubic-bezier(.22, 1, .36, 1); --in: 520ms; --out: 260ms;
  }
  .pill {
    background: linear-gradient(180deg, rgba(52, 16, 8, .92), rgba(23, 5, 3, .92));
    border: 1px solid var(--gilt-line); border-radius: 12px;
    box-shadow: inset 0 1px 0 rgba(255, 222, 150, .18), 0 8px 22px rgba(0, 0, 0, .5);
  }
  #namo { right: 24px; top: 240px; padding: 10px 18px; font-size: 30px; font-weight: 700; color: var(--gilt);
    font-variant-numeric: tabular-nums; }
  #namo span { display: inline-block; }
  #namo.bump span { animation: bump 600ms var(--ease-out); }
  @keyframes bump { 30% { transform: scale(1.12); color: #fff2c4; } }
  #banner { left: 50%; top: 240px; translate: -50% 0; max-width: 520px; padding: 10px 22px; font-size: 28px; color: var(--ink);
    text-align: center; opacity: 0; transform: translateY(-10px) scale(.98);
    transition: opacity var(--out) ease-in, transform var(--out) ease-in; }
  #banner.on { opacity: 1; transform: none; transition: opacity var(--in) var(--ease-out), transform var(--in) var(--ease-out); }
  /* Hanging couplet boards: red lacquer, gilt double frame, engraved gilt letters. */
  .couplet { top: 330px; width: 66px; padding: 22px 0; border-radius: 3px;
    background: linear-gradient(90deg, #5c0d08, #8c160e 45%, #6e100a);
    outline: 2px solid #b8893a; outline-offset: -7px; border: 2px solid #3a0704;
    box-shadow: 0 14px 28px rgba(0, 0, 0, .55);
    color: var(--gilt); font-size: 30px; font-weight: 700; line-height: 1.25; text-align: center;
    text-shadow: 0 1px 0 rgba(0, 0, 0, .7), 0 -1px 0 rgba(255, 230, 170, .25);
    transition: opacity .8s ease; }
  .couplet::before, .couplet::after { content: ''; position: absolute; left: -6px; right: -6px; height: 8px; border-radius: 3px;
    background: linear-gradient(#e8c278, #8a6424); }
  .couplet::before { top: -6px; } .couplet::after { bottom: -6px; }
  #couplet-l { left: 210px; } #couplet-r { right: 210px; }
  #altar-cards { left: 0; right: 0; top: 800px; height: 0; }
  .card { position: absolute; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; translate: -50% 0;
    white-space: nowrap; animation: card-in var(--in) var(--ease-out); }
  @keyframes card-in { from { opacity: 0; transform: translateY(14px); } }
  .avatar { flex: none; width: 46px; height: 46px; border-radius: 50%; color: #3a1800; font-weight: 700; font-size: 24px;
    display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #f6d68a, #b8862e 70%);
    box-shadow: inset 0 -2px 3px rgba(0, 0, 0, .3), 0 0 0 2px rgba(226, 184, 102, .35); }
  .card b { display: block; font-size: 22px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .card span { font-size: 19px; color: var(--gilt); }
  #donor { right: 24px; top: 960px; width: 290px; }
  #donor .card { position: static; translate: none; animation-name: donor-in; }
  @keyframes donor-in { from { opacity: 0; transform: translateX(28px); } }
  #board { right: 24px; top: 1050px; width: 290px; padding: 12px 16px; font-size: 20px; }
  #board h3 { margin: 0 0 8px; padding-bottom: 6px; text-align: center; color: var(--gilt); letter-spacing: 6px; font-size: 22px;
    border-bottom: 1px solid var(--gilt-line); }
  #board ol { margin: 0; padding-left: 26px; font-variant-numeric: tabular-nums; }
  #board li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; color: var(--ink); }
  #board li::marker { color: var(--gilt); }
  #footer { left: 24px; top: 1225px; width: 720px; padding: 12px 18px; font-size: 22px; line-height: 1.4; text-align: center; color: #f3dcc0; }
  #footer div:first-child { font-size: 28px; font-weight: 700; color: var(--gilt); margin-bottom: 2px; }
  #credit { left: 24px; top: 1350px; font-size: 13px; opacity: .7; }
  #fps { right: 8px; bottom: 8px; font: 20px monospace; display: none; }
  .label { font-size: 15px; color: #fff4e4; text-shadow: 0 1px 2px #000, 0 0 6px rgba(0, 0, 0, .9); white-space: nowrap; text-align: center; }
  .label.gold { color: var(--gilt); padding: 1px 7px; border: 1px solid var(--gilt-line); border-radius: 8px; background: rgba(42, 12, 4, .7); }
  .bubble { margin-bottom: 4px; padding: 5px 10px; max-width: 220px; white-space: normal; background: rgba(255, 246, 228, .94);
    color: #4a2a00; border-radius: 12px 12px 12px 4px; font-size: 15px; text-shadow: none;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .4); transition: opacity .6s; }
  #sound { right: 24px; bottom: 24px; padding: 14px 22px; font-size: 22px; display: none; color: var(--gilt); font-family: inherit; }
  @media (prefers-reduced-motion: reduce) {
    #banner, #banner.on { transform: none; transition: opacity .2s; }
    .card, #donor .card, #namo.bump span { animation: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="labels"></div>
  <div id="couplet-l" class="couplet"></div>
  <div id="couplet-r" class="couplet"></div>
  <div id="altar-cards"></div>
  <div id="namo" class="pill">Đã niệm: <span>0</span></div>
  <div id="banner" class="pill"></div>
  <div id="donor"></div>
  <div id="board" class="pill"><h3>TRI ÂN</h3><ol></ol></div>
  <div id="footer" class="pill">
    <div>Gõ "Nam mô A Di Đà Phật" để vào lễ Phật</div>
    <div>Thêm "cầu bình an / tài lộc / sức khỏe / tình duyên / gia đạo / học hành / công danh" để gửi lời cầu</div>
  </div>
  <div id="credit"></div>
  <div id="fps"></div>
  <button id="sound" class="pill">Bật âm thanh</button>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
